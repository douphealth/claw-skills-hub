name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build the project
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=claw-skills-hub

      - name: Ping IndexNow for fast indexing
        if: success()
        run: |
          if [ -f dist/indexnow-urls.json ]; then
            # Split into batches of 10000 (IndexNow max)
            TOTAL=$(python3 -c "import json; print(len(json.load(open('dist/indexnow-urls.json'))))")
            echo "Submitting $TOTAL URLs to IndexNow..."
            python3 -c "
          import json, urllib.request
          urls = json.load(open('dist/indexnow-urls.json'))
          batch_size = 10000
          key = '${{ secrets.INDEXNOW_KEY }}'
          for i in range(0, len(urls), batch_size):
              batch = urls[i:i+batch_size]
              payload = json.dumps({
                  'host': 'openclaw-skillshub.com',
                  'key': key,
                  'keyLocation': f'https://openclaw-skillshub.com/{key}.txt',
                  'urlList': batch
              }).encode()
              req = urllib.request.Request('https://api.indexnow.org/indexnow',
                  data=payload, headers={'Content-Type': 'application/json'})
              try:
                  urllib.request.urlopen(req)
                  print(f'Batch {i//batch_size+1}: {len(batch)} URLs submitted')
              except Exception as e:
                  print(f'Batch {i//batch_size+1} failed: {e}')
          " || echo "IndexNow ping failed (non-critical)"
          else
            echo "No indexnow-urls.json found, skipping"
          fi

      - name: Ping search engine sitemaps
        if: success()
        run: |
          curl -sf "https://www.google.com/ping?sitemap=https://openclaw-skillshub.com/sitemap.xml" || true
          curl -sf "https://www.bing.com/ping?sitemap=https://openclaw-skillshub.com/sitemap.xml" || true
