name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build the project
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=claw-skills-hub

      - name: Ping IndexNow for fast indexing
        if: success()
        run: |
          curl -sf -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "openclaw-skillshub.com",
              "key": "${{ secrets.INDEXNOW_KEY }}",
              "keyLocation": "https://openclaw-skillshub.com/${{ secrets.INDEXNOW_KEY }}.txt",
              "urlList": [
                "https://openclaw-skillshub.com/",
                "https://openclaw-skillshub.com/skills",
                "https://openclaw-skillshub.com/articles",
                "https://openclaw-skillshub.com/articles/best-openclaw-skills-2026",
                "https://openclaw-skillshub.com/articles/what-are-openclaw-skills",
                "https://openclaw-skillshub.com/articles/how-to-install-openclaw-skills",
                "https://openclaw-skillshub.com/articles/how-to-audit-skill-md",
                "https://openclaw-skillshub.com/articles/openclaw-skills-vs-plugins-vs-mcp",
                "https://openclaw-skillshub.com/tutorials",
                "https://openclaw-skillshub.com/glossary"
              ]
            }' || echo "IndexNow ping failed (non-critical)"

      - name: Ping search engine sitemaps
        if: success()
        run: |
          curl -sf "https://www.google.com/ping?sitemap=https://openclaw-skillshub.com/sitemap.xml" || true
          curl -sf "https://www.bing.com/ping?sitemap=https://openclaw-skillshub.com/sitemap.xml" || true
